[package]
name = "galileo-iced"
version = "0.1.0"
edition = "2024"
description = "A Galileo map widget for the iced GUI framework"

[lib]
name = "galileo_iced"
path = "src/lib.rs"
crate-type = ["lib"]


[dependencies]
galileo = { path = "../galileo/galileo" }
iced_core = { version = "0.14" }
iced_graphics = { version = "0.14" }
iced_wgpu = { version = "0.14" }
iced_futures = { version = "0.14" }
log = "0.4"
tokio = { version = "1" }

[dev-dependencies]
iced = "0.14"

