[package]
name = "galileo-iced"
version = "0.1.0"
edition = "2024"
description = "A Galileo map widget for the iced GUI framework"

[lib]
name = "galileo_iced"
path = "src/lib.rs"
crate-type = ["lib"]


[dependencies]
galileo = { git = "https://github.com/galileo-map/galileo.git", rev = "6bd45868da9ba97a4a117b491714a01f1a842da6" }
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a" }
iced_graphics = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a" }
iced_wgpu = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a" }
iced_futures = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a" }
log = "0.4"
tokio = { version = "1" }

[dev-dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a" }

